<!-- attend_update.html -->
{% extends 'layouts/base2.html' %}

{% block title %} Appointment Details {% endblock title %}

{% block content %}
  <style>
    /* Internal CSS for attend_update.html */
    .form-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background-color: #f9f9f9;
    }

    .form-container h2 {
      text-align: center;
      color: #333;
    }

    .form-container form {
      display: flex;
      flex-direction: column;
    }

    .form-container form button {
      align-self: center;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    .form-container form button:hover {
      background-color: #0056b3;
    }
  </style>

  <div class="form-container">
    <h2>Update Attend Record</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Update</button>
    </form>
  </div>

  {% include "includes/footer.html" %}
{% endblock content %}
